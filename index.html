<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обучение WMT — AI-трансформация бизнеса</title>
    <!-- Прогреваем соединение к CDN Spline заранее — рукопожатие TLS идёт параллельно
         с загрузкой страницы, а не после того, как React смонтирует сцену. -->
    <link rel="preconnect" href="https://prod.spline.design" crossorigin />
    <link rel="dns-prefetch" href="https://prod.spline.design" />
    <!-- Poster робота — LCP-картинка hero, грузим с высшим приоритетом ещё до старта JS. -->
    <link rel="preload" as="image" href="/hero/robot-light.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
